- region "Gallery":
  - textbox "Search prompts"
  - combobox "Filter by shape":
    - option "All shapes" [selected]
    - option "1:1"
    - option "1:2"
    - option "2:1"
    - option "2:3"
    - option "3:2"
    - option "3:4"
    - option "4:3"
    - option "4:5"
    - option "5:4"
    - option /9:\d+/
    - option /\d+:9/
    - option /9:\d+\.\d+/
    - option /\d+\.\d+:9/
    - option /9:\d+/
    - option /\d+:9/
    - option /9:\d+/
    - option /\d+:9/
    - option "auto"
  - button "Library"
  - article:
    - 'button "Open image 1: Square teal study"': /\$\d+\.\d+/
    - text: /Square teal study Seedream 1:1 [\d,.]+[bkmBKM]+ png Oct \d+, \d+:\d+ (AM|PM)/
    - button "Retry image 1 with same settings"
    - button "Copy image 1"
    - button "Download image 1 PNG"
    - button "Delete image 1"
  - article:
    - 'button "Open image 2: Wide coastline panorama"': /\$\d+\.\d+/
    - text: /Wide coastline panorama Seedream \d+:9 [\d,.]+[bkmBKM]+ png Oct \d+, \d+:\d+ (AM|PM)/
    - button "Retry image 2 with same settings"
    - button "Copy image 2"
    - button "Download image 2 PNG"
    - button "Delete image 2"
  - article:
    - 'button "Open image 3: Tall lighthouse"': /\$\d+\.\d+/
    - text: /Tall lighthouse Seedream 9:\d+ [\d,.]+[bkmBKM]+ webp Oct \d+, \d+:\d+ (AM|PM)/
    - button "Retry image 3 with same settings"
    - button "Copy image 3"
    - button "Download image 3 PNG"
    - button "Delete image 3"
  - article:
    - 'button "Open image 4: Still life with two refs"': /\$\d+\.\d+/
    - text: /Still life with two refs Seedream 3:2 [\d,.]+[bkmBKM]+ png \+2 ref Oct \d+, \d+:\d+ (AM|PM)/
    - button "Retry image 4 with same settings"
    - button "Copy image 4"
    - button "Download image 4 PNG"
    - button "Delete image 4"